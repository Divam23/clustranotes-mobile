name: clustranotes_mobile
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.9.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  timeago: ^3.7.0
  pdf: ^3.13.0
  path_provider: ^2.1.6
  image_picker: ^1.2.2
  printing: ^5.15.0
  open_filex: ^4.7.0
  flutter_riverpod: ^3.3.2
  file_picker: ^11.0.2
  path: ^1.9.1
  dotted_border: ^3.1.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  reorderable_grid_view: ^2.2.8
  photo_view: ^0.15.0
  pdfrx: ^2.4.7
  dio: ^5.11.0
  pretty_dio_logger: ^1.4.0
  flutter_secure_storage: ^10.3.1
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  google_sign_in: ^7.2.0
  flutter_svg: ^2.3.0
  go_router: ^17.5.0
  flutter_native_splash: ^2.4.8
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  flutter_launcher_icons: ^0.14.4
  

  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true
    
  assets:
    - assets/icons/
    - assets/images/
    - assets/animations/
    - assets/dummy/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf

        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500

        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icons/clustra_logo.png
  fullscreen: true

  color_dark: "#121212"
  image_dark: assets/icons/clustra_logo.png

  android_12:
    color: "#FFFFFF"
    image: assets/icons/clustra_logo.png

    color_dark: "#121212"
    image_dark: assets/icons/clustra_logo.png
